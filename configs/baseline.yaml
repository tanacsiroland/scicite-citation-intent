# Configuration for TF-IDF + Logistic Regression Baseline
seed: 42

data:
  dataset_name: "allenai/scicite"
  tfidf:
    max_features: 10000
    ngram_range: [1, 2]
    sublinear_tf: true
    min_df: 2

model:
  c_param: 1.0
  solver: "lbfgs"
  max_iter: 1000
  class_weight: "balanced"

ablation:
  modes:
    - "text_only"
    - "section_aware"
